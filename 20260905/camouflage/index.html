<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>camouflage — play</title>
  <meta name="description" content="A random camouflage pattern, one click at a time.">
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem('theme'); } catch (e) {}
      if (t !== 'day' && t !== 'night' && t !== 'system' && t !== 'circadian') t = 'system';
      document.documentElement.dataset.theme = t;
      if (t === 'circadian') {
        try {
          var cache = JSON.parse(localStorage.getItem('circadian-cache'));
          for (var k in cache) document.documentElement.style.setProperty(k, cache[k]);
        } catch (e) {}
      }
    })();
  </script>
  <style>
    @font-face {
      font-family: "Labil Grotesk";
      src: url("/assets/fonts/LabilGrotesk-Regular.woff2") format("woff2"),
           url("/assets/fonts/LabilGrotesk-Regular.woff") format("woff");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --night: #0d1b1e;
      --orange: #ff795c;
      --white: #fff5f5;

      --bg: var(--white);
      --ink: var(--night);
      --muted: color-mix(in srgb, var(--night) 55%, var(--white));
      --separator: color-mix(in srgb, var(--night) 5%, transparent);
      --pill-bg: rgba(255, 245, 245, 0.2);
      --pill-filter: blur(10px) saturate(180%);

      --chrome-top: 40px;
      --chrome-pad: 40px;
    }
    [data-theme="night"] {
      --bg: var(--night);
      --ink: var(--white);
      --muted: color-mix(in srgb, var(--white) 55%, var(--night));
      --separator: color-mix(in srgb, var(--white) 8%, transparent);
      --pill-bg: rgba(13, 27, 30, 0.5);
    }
    @media (prefers-color-scheme: dark) {
      [data-theme="system"] {
        --bg: var(--night);
        --ink: var(--white);
        --muted: color-mix(in srgb, var(--white) 55%, var(--night));
        --separator: color-mix(in srgb, var(--white) 8%, transparent);
        --pill-bg: rgba(13, 27, 30, 0.5);
      }
    }

    * { box-sizing: border-box; margin: 0; }
    html, body { height: 100%; overflow: hidden; }
    html { scrollbar-gutter: stable; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: "Labil Grotesk", system-ui, sans-serif;
      font-size: 16px;
      line-height: 1.3;
      transition: background-color 240ms ease, color 240ms ease;
      -webkit-font-smoothing: antialiased;
    }

    /* ---- Swiss / warm minimal chrome ---- */
    .chrome {
      position: fixed; top: var(--chrome-top); left: 0; right: 0; z-index: 500;
      display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
      padding: 0 var(--chrome-pad); pointer-events: none;
    }
    .chrome > * { pointer-events: auto; }
    .chrome__back  { justify-self: start; }
    .chrome__id    { justify-self: center; }
    .chrome__theme { justify-self: end; }

    .header-pill {
      background: var(--pill-bg); backdrop-filter: var(--pill-filter); -webkit-backdrop-filter: var(--pill-filter);
      border-radius: 32px; padding: 8px; box-shadow: inset 0 0 0 1px var(--separator); margin: 0;
    }
    .header-pill__inner { display: flex; align-items: center; gap: 12px; }
    .header-pill__avatar { width: 48px; height: 48px; border-radius: 48px; background: var(--separator); overflow: hidden; flex-shrink: 0; }
    .header-pill__avatar svg { width: 100%; height: 100%; display: block; }
    .header-pill__label { display: flex; flex-direction: column; gap: 4px; padding-right: 12px; }
    .header-pill__name { font-size: 16px; line-height: 1.3; }
    .header-pill__role { font-size: 16px; line-height: 1.3; opacity: 0.6; }

    .icon-pill {
      background: var(--pill-bg); backdrop-filter: var(--pill-filter); -webkit-backdrop-filter: var(--pill-filter);
      border: 0; border-radius: 32px; padding: 8px; cursor: pointer; color: var(--ink);
      box-shadow: inset 0 0 0 1px var(--separator); display: inline-flex; font: inherit;
      position: relative; overflow: hidden; text-decoration: none;
    }
    .icon-pill::before {
      content: ''; position: absolute; top: 8px; left: 8px; width: 48px; height: 48px;
      background: var(--separator); border-radius: 48px; z-index: 0;
      transition: top 240ms cubic-bezier(0.4,0,0.2,1), left 240ms cubic-bezier(0.4,0,0.2,1),
                  width 240ms cubic-bezier(0.4,0,0.2,1), height 240ms cubic-bezier(0.4,0,0.2,1),
                  border-radius 240ms cubic-bezier(0.4,0,0.2,1);
    }
    .icon-pill:hover::before, .icon-pill:focus-visible::before {
      top: 3.2px; left: 3.2px; width: 57.6px; height: 57.6px; border-radius: 38.4px;
    }
    .icon-pill__icon {
      width: 48px; height: 48px; border-radius: 48px; display: grid; place-items: center;
      flex-shrink: 0; position: relative; z-index: 1;
    }
    .icon-pill__icon svg { grid-area: 1 / 1; width: 16px; height: 16px; transition: opacity 240ms ease-out, transform 240ms cubic-bezier(0.4,0,0.2,1); }
    .icon-pill--theme .icon-pill__icon svg { opacity: 0; transform: rotate(-90deg) scale(0.85); }
    [data-theme="day"]       .icon-pill--theme svg[data-tstate="day"],
    [data-theme="night"]     .icon-pill--theme svg[data-tstate="night"],
    [data-theme="system"]    .icon-pill--theme svg[data-tstate="system"],
    [data-theme="circadian"] .icon-pill--theme svg[data-tstate="circadian"] { opacity: 1; transform: rotate(0deg) scale(1); }
    [data-theme="day"]       .icon-pill--theme:hover svg[data-tstate="day"],
    [data-theme="night"]     .icon-pill--theme:hover svg[data-tstate="night"],
    [data-theme="system"]    .icon-pill--theme:hover svg[data-tstate="system"],
    [data-theme="circadian"] .icon-pill--theme:hover svg[data-tstate="circadian"] { opacity: 0; transform: rotate(90deg) scale(0.85); }
    [data-theme="day"]       .icon-pill--theme:hover svg[data-tstate="night"],
    [data-theme="night"]     .icon-pill--theme:hover svg[data-tstate="system"],
    [data-theme="system"]    .icon-pill--theme:hover svg[data-tstate="circadian"],
    [data-theme="circadian"] .icon-pill--theme:hover svg[data-tstate="day"] { opacity: 1; transform: rotate(0deg) scale(1); }

    /* Full-bleed canvas */
    #stage { position: fixed; inset: 0; }
    #camo { display: block; width: 100%; height: 100%; }

    /* Teletext-style Random pill — bottom-right */
    .dock {
      position: fixed;
      right: var(--chrome-pad);
      bottom: 28px;
      z-index: 500;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .seed {
      font-size: 11px;
      letter-spacing: 0.06em;
      color: color-mix(in srgb, var(--ink) 55%, transparent);
      font-variant-numeric: tabular-nums;
      pointer-events: none;
      text-shadow: 0 1px 2px color-mix(in srgb, var(--bg) 40%, transparent);
    }
    .tool-pill {
      display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 14px 0 12px;
      border: 1px solid color-mix(in srgb, var(--ink) 14%, transparent); border-radius: 22px;
      background: color-mix(in srgb, var(--bg) 55%, transparent);
      backdrop-filter: blur(8px) saturate(140%);
      -webkit-backdrop-filter: blur(8px) saturate(140%);
      color: var(--ink); font: inherit; font-size: 14px; line-height: 1;
      cursor: pointer; transition: background-color 200ms ease, border-color 200ms ease, color 200ms ease;
    }
    .tool-pill:hover, .tool-pill:focus-visible {
      background: color-mix(in srgb, var(--bg) 72%, transparent);
      border-color: color-mix(in srgb, var(--ink) 28%, transparent);
    }
    .tool-pill:active { transform: scale(0.96); }
    .tool-pill__icon { display: grid; place-items: center; width: 16px; height: 16px; flex-shrink: 0; }
    .tool-pill__icon svg { width: 16px; height: 16px; }

    @media (max-width: 900px) {
      :root { --chrome-top: 16px; --chrome-pad: 16px; }
      .header-pill__role { display: none; }
      .dock { bottom: 20px; }
    }
  </style>
</head>
<body>
  <div class="chrome">
    <a class="icon-pill chrome__back" href="/" aria-label="Back to play index">
      <span class="icon-pill__icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
      </span>
    </a>
    <header class="header-pill chrome__id">
      <div class="header-pill__inner">
        <div class="header-pill__avatar">
          <svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg"> <rect width="2.00001" height="2.00001" transform="matrix(-1 0 0 1 32 13)" fill="currentColor"/> <rect width="4.00001" height="2.00001" transform="matrix(-1 0 0 1 20 13)" fill="currentColor"/> <path d="M34.0098 34.9766V48H36V34.9766H34.0098ZM13.9902 34.9766H12V48H13.9902V35.0293H15.9805V32.9814H13.9902V34.9766ZM32 13H16V9H14V17H16V15H32V25H30V27H18V31H16V33H18V35H30V33H32V35H34V33H32V31H34V15H40V13H34V9H32V13ZM12 22H14V17H12V22ZM28 21H30V19H28V21ZM20 21H22V19H20V21ZM30 9H32V7H30V9ZM16 9H18V7H16V9ZM18 7H30V5H18V7Z" fill="currentColor"/> <rect width="4" height="6" transform="matrix(-1 0 0 1 18 27)" fill="currentColor"/> <rect width="2.00001" height="4.00001" transform="matrix(-1 0 0 1 16 21)" fill="currentColor"/> <path d="M16 25H18V21H16V25Z" fill="currentColor"/> <rect width="16.0001" height="2.00001" transform="matrix(-1 0 0 1 30 25)" fill="currentColor"/> <rect width="4.00001" height="2.00001" transform="matrix(-1 0 0 1 32 23)" fill="currentColor"/> <rect width="4.00001" height="2.00001" transform="matrix(-1 0 0 1 24 23)" fill="currentColor"/> <rect width="4.00001" height="2.00001" transform="matrix(-1 0 0 1 28 21)" fill="currentColor"/> </svg>
        </div>
        <div class="header-pill__label">
          <span class="header-pill__name">Ravi Vasavan</span>
          <span class="header-pill__role">Camouflage</span>
        </div>
      </div>
    </header>
    <button class="icon-pill icon-pill--theme chrome__theme" type="button" aria-label="Toggle theme" data-theme-toggle>
      <span class="icon-pill__icon">
        <svg data-tstate="day" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
        <svg data-tstate="night" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
        <svg data-tstate="system" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="20" height="14" x="2" y="3" rx="2"/><line x1="8" x2="16" y1="21" y2="21"/><line x1="12" x2="12" y1="17" y2="21"/></svg>
        <svg data-tstate="circadian" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
      </span>
    </button>
  </div>

  <main id="stage" aria-label="Camouflage pattern">
    <canvas id="camo" role="img" aria-label="A generated camouflage pattern"></canvas>
  </main>

  <div class="dock">
    <span class="seed" aria-live="polite"><span id="seed">--------</span></span>
    <button class="tool-pill" id="p-random" type="button" aria-label="Generate a new camouflage pattern">
      <span class="tool-pill__icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M2 18h1.4c1.3 0 2.5-.6 3.3-1.7l6.1-8.6c.7-1.1 2-1.7 3.3-1.7H22"/><path d="m18 2 4 4-4 4"/><path d="M2 6h1.9c1.5 0 2.9.9 3.6 2.2"/><path d="M22 18h-5.9c-1.3 0-2.6-.7-3.3-1.8l-.5-.8"/><path d="m18 14 4 4-4 4"/>
        </svg>
      </span>
      <span class="tool-pill__label">Random</span>
    </button>
  </div>

  <script src="camo.js"></script>
  <script src="/assets/circadian.js" defer></script>
</body>
</html>
