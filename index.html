<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>play — Ravi Vasavan</title>
  <meta name="description" content="Experiments, out in the open.">
  <style>
    @font-face {
      font-family: "Labil Grotesk";
      src: url("/assets/fonts/LabilGrotesk-Regular.woff2") format("woff2"),
           url("/assets/fonts/LabilGrotesk-Regular.woff") format("woff");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    :root {
      /* Brand colours — inherited from ravivasavan.com */
      --night: #0d1b1e;
      --orange: #ff795c;
      --white: #fff5f5;

      --bg: var(--white);
      --fg: var(--night);
      --separator: color-mix(in srgb, var(--night) 5%, transparent);
      --pill-bg: rgba(255, 245, 245, 0.2);
      --pill-filter: blur(10px) saturate(180%);
      --pill-edge: inset 0 0 0 1px var(--separator);
      --shell-width: min(80%, 1440px);
      --row-pad: 24px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: var(--night);
        --fg: var(--white);
        --separator: color-mix(in srgb, var(--white) 8%, transparent);
        --pill-bg: rgba(13, 27, 30, 0.5);
      }
    }

    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    html { background: var(--bg); }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: "Labil Grotesk", system-ui, sans-serif;
      font-size: 16px;
      line-height: 1.3;
    }
    a { color: inherit; text-decoration: none; }

    /* Header pills — ported from ravivasavan.com */
    .header-pills {
      position: fixed;
      top: 40px;
      left: 0;
      right: 0;
      z-index: 50;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      pointer-events: none;
    }
    .header-pills > * { pointer-events: auto; }
    .header-pills > .header-back-pill { grid-column: 1; justify-self: end; margin-right: 8px; }
    .header-pills > .header-pill { grid-column: 2; justify-self: center; }

    .header-pill {
      background: var(--pill-bg);
      backdrop-filter: var(--pill-filter);
      -webkit-backdrop-filter: var(--pill-filter);
      border-radius: 32px;
      padding: 8px;
      box-shadow: var(--pill-edge);
      margin: 0;
    }
    .header-pill__inner { display: flex; align-items: center; gap: 12px; }
    .header-pill__avatar {
      width: 48px;
      height: 48px;
      border-radius: 48px;
      background: var(--separator);
      overflow: hidden;
      flex-shrink: 0;
    }
    .header-pill__avatar svg { width: 100%; height: 100%; display: block; }
    .header-pill__label { display: flex; flex-direction: column; gap: 4px; padding-right: 12px; }
    .header-pill__name { font-size: 16px; line-height: 1.3; }
    .header-pill__role { font-size: 16px; line-height: 1.3; opacity: 0.6; }

    .header-back-pill {
      background: var(--pill-bg);
      backdrop-filter: var(--pill-filter);
      -webkit-backdrop-filter: var(--pill-filter);
      border-radius: 32px;
      padding: 8px;
      color: var(--fg);
      box-shadow: var(--pill-edge);
      position: relative;
      display: flex;
      height: 64px;
      transition: padding 320ms cubic-bezier(0.4, 0, 0.2, 1);
    }
    .header-back-pill:hover,
    .header-back-pill:focus-visible { padding: 4px; }
    .header-back-pill__inner {
      display: flex;
      align-items: center;
      align-self: stretch;
      background: color-mix(in srgb, var(--fg) 10%, transparent);
      border-radius: 48px;
      overflow: hidden;
    }
    .header-back-pill__icon {
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      flex-shrink: 0;
      transition: margin-right 320ms cubic-bezier(0.4, 0, 0.2, 1);
    }
    .header-back-pill:hover .header-back-pill__icon { margin-right: -4px; }
    .header-back-pill__chev { width: 16px; height: 16px; }
    .header-back-pill__label {
      font-size: 16px;
      max-width: 0;
      opacity: 0;
      white-space: nowrap;
      padding-right: 0;
      transform: translateX(16px);
      transition:
        max-width     320ms cubic-bezier(0.4, 0, 0.2, 1),
        opacity       320ms cubic-bezier(0.4, 0, 0.2, 1),
        transform     320ms cubic-bezier(0.4, 0, 0.2, 1),
        padding-right 320ms cubic-bezier(0.4, 0, 0.2, 1);
    }
    .header-back-pill:hover .header-back-pill__label,
    .header-back-pill:focus-visible .header-back-pill__label {
      max-width: 200px;
      opacity: 1;
      transform: translateX(0);
      padding-right: 16px;
    }

    /* Page shell */
    .page {
      min-height: 100vh;
      padding-top: 144px;
      padding-bottom: 120px;
    }
    .shell {
      width: var(--shell-width);
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 80px;
    }
    /* Index rows — main-site row language */
    .index-section { width: 100%; display: flex; flex-direction: column; }
    .index-section__head {
      display: flex;
      align-items: center;
      height: 64px;
      padding: 0 var(--row-pad);
    }
    .index-section__title {
      font-size: 24px;
      line-height: 1.3;
      margin: 0;
      font-weight: 400;
      text-wrap: balance;
    }
    .row {
      display: grid;
      grid-template-columns: repeat(12, minmax(0, 1fr));
      align-items: center;
      gap: 16px;
      padding: var(--row-pad);
      border-top: 1px solid var(--separator);
      transition: background-color 120ms ease, color 120ms ease;
    }
    .row:last-child { border-bottom: 1px solid var(--separator); }
    .row__title { grid-column: 1 / span 6; text-wrap: balance; }
    .row__desc {
      grid-column: span 3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .row__date {
      grid-column: span 3 / -1;
      text-align: right;
      white-space: nowrap;
    }
    .row:hover {
      background: var(--orange);
      color: var(--night);
    }

    @media (max-width: 900px) {
      :root { --shell-width: calc(100% - 32px); }
      .page { padding-top: 112px; }
      .header-pills { top: 16px; }
    }
    @media (max-width: 640px) {
      .header-pills {
        top: 12px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 12px;
      }
      .header-pills > .header-back-pill,
      .header-pills > .header-pill { margin: 0; }
      .header-pill__role { display: none; }
      .index-section__head { padding: 0; }
      .row {
        grid-template-columns: 1fr auto;
        gap: 2px 16px;
        padding: 16px 0;
      }
      .row__title { grid-column: 1; font-size: 17px; }
      .row__date { grid-column: 2; grid-row: 1; }
      .row__desc {
        grid-column: 1 / -1;
        white-space: normal;
        font-size: 14px;
        opacity: 0.75;
      }
    }
  </style>
</head>
<body>
  <div class="header-pills">
    <a class="header-back-pill" href="https://ravivasavan.com" aria-label="Home">
      <div class="header-back-pill__inner">
        <span class="header-back-pill__icon">
          <svg class="header-back-pill__chev" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M10 4L6 8L10 12" stroke="currentColor" stroke-width="1.25" stroke-linecap="square" stroke-linejoin="miter"/>
          </svg>
        </span>
        <span class="header-back-pill__label">Home</span>
      </div>
    </a>
    <header class="header-pill">
      <div class="header-pill__inner">
        <div class="header-pill__avatar">
          <svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg"> <rect width="2.00001" height="2.00001" transform="matrix(-1 0 0 1 32 13)" fill="currentColor"/> <rect width="4.00001" height="2.00001" transform="matrix(-1 0 0 1 20 13)" fill="currentColor"/> <path d="M34.0098 34.9766V48H36V34.9766H34.0098ZM13.9902 34.9766H12V48H13.9902V35.0293H15.9805V32.9814H13.9902V34.9766ZM32 13H16V9H14V17H16V15H32V25H30V27H18V31H16V33H18V35H30V33H32V35H34V33H32V31H34V15H40V13H34V9H32V13ZM12 22H14V17H12V22ZM28 21H30V19H28V21ZM20 21H22V19H20V21ZM30 9H32V7H30V9ZM16 9H18V7H16V9ZM18 7H30V5H18V7Z" fill="currentColor"/> <rect width="4" height="6" transform="matrix(-1 0 0 1 18 27)" fill="currentColor"/> <rect width="2.00001" height="4.00001" transform="matrix(-1 0 0 1 16 21)" fill="currentColor"/> <path d="M16 25H18V21H16V25Z" fill="currentColor"/> <rect width="16.0001" height="2.00001" transform="matrix(-1 0 0 1 30 25)" fill="currentColor"/> <rect width="4.00001" height="2.00001" transform="matrix(-1 0 0 1 32 23)" fill="currentColor"/> <rect width="4.00001" height="2.00001" transform="matrix(-1 0 0 1 24 23)" fill="currentColor"/> <rect width="4.00001" height="2.00001" transform="matrix(-1 0 0 1 28 21)" fill="currentColor"/> </svg>
        </div>
        <div class="header-pill__label">
          <span class="header-pill__name">Ravi Vasavan</span>
          <span class="header-pill__role">Play</span>
        </div>
      </div>
    </header>
  </div>

  <main class="page">
    <div class="shell">
      <section class="index-section">
        <div class="index-section__head">
          <h1 class="index-section__title">Experiments, out in the open.</h1>
        </div>
        <a class="row" href="/experiments/magnetic/">
          <span class="row__title">Magnetic</span>
          <span class="row__desc">Scattered windows that magnetise into a portrait</span>
          <span class="row__date">20260731a</span>
        </a>
      </section>
    </div>
  </main>
</body>
</html>
