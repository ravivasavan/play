  <script>
    /* Set data-theme and the address-bar colour before paint, to avoid a
       flash. Cycles: day → night → system → circadian. Circadian colours are
       computed by circadian.js, which play.js only loads when it's wanted, so
       its last cached tokens are re-applied here to keep first paint right. */
    (function () {
      var t = null;
      try { t = localStorage.getItem('theme'); } catch (e) {}
      if (t !== 'day' && t !== 'night' && t !== 'system' && t !== 'circadian') t = 'system';
      document.documentElement.dataset.theme = t;
      var c = '#fff5f5';
      if (t === 'night') c = '#0d1b1e';
      else if (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches) c = '#0d1b1e';
      else if (t === 'circadian') {
        try {
          var cache = JSON.parse(localStorage.getItem('circadian-cache'));
          for (var k in cache) document.documentElement.style.setProperty(k, cache[k]);
          if (cache && cache['--bg']) c = cache['--bg'];
        } catch (e) {}
      }
      var m = document.getElementById('theme-color');
      if (m) m.setAttribute('content', c);
    })();
  </script>

  <style>
    /* Camouflage's own half of the page: the stage the pattern fills and the
       seed chip that sits on it. The type, the tokens, both chrome rows, the
       glass and every control in the sheet come from play.css. */

    html, body { height: 100%; overflow: hidden; }

    /* ---- the stage ---- */
    /* The pattern is the page, so it takes everything the sheet does not: the
       viewport less the glass and its two gaps. camo.js measures this box
       rather than the window, so the pattern is never cropped by the sheet. */
    #stage {
      position: fixed; top: 0; left: 0; bottom: 0; right: var(--sheet-inset);
      overflow: hidden;
    }
    #camo { display: block; width: 100%; height: 100%; }

    /* ---- the seed ---- */
    /* Eight hex digits is the whole state of a pattern, so it stays on screen
       rather than folding away with the sheet. It lies over the camouflage, so
       it needs the same glass under it as everything else does. */
    .seed {
      position: fixed;
      left: var(--chrome-pad);
      bottom: 20px;
      z-index: 400;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 28px;
      padding: 0 10px;
      border-radius: 14px;
      background: var(--glass-bg);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      box-shadow: var(--glass-edge), var(--glass-specular), var(--glass-shadow-sm);
      font-size: 11px;
      letter-spacing: 0.06em;
      color: var(--ink);
      font-variant-numeric: tabular-nums;
      pointer-events: none;
    }
    .seed__label { color: color-mix(in srgb, var(--ink) 55%, transparent); }

    /* Folded: the sheet swings to the bottom of the screen, so the stage takes
       the full width and stops above the collapsed glass, and the seed rides
       up with it. */
    @media (max-width: 900px) {
      #stage { right: 0; bottom: 76px; }
      .seed { bottom: 84px; }
    }
  </style>
</head>

        <svg data-tstate="night" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
        <svg data-tstate="system" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="20" height="14" x="2" y="3" rx="2"/><line x1="8" x2="16" y1="21" y2="21"/><line x1="12" x2="12" y1="17" y2="21"/></svg>

  </div>
  <div class="chrome-rule" aria-hidden="true"></div>

  <nav class="tools tools--sheet" aria-label="Camouflage controls">
    <button class="tool-pill" id="p-random" type="button" aria-label="Generate a new camouflage pattern">

        </svg>
      </span>
      <span class="tool-pill__label">Random</span>

  <main id="stage" aria-label="Camouflage pattern">
    <canvas id="camo" role="img" aria-label="A generated camouflage pattern"></canvas>
  </main>

  <p class="seed" aria-live="polite"><span class="seed__label">Seed</span><span id="seed">--------</span></p>

  <aside class="sheet" aria-label="Camouflage settings">
    <div class="sheet__head">
      <span class="sheet__title">Camouflage</span>
      <span class="sheet__summary" id="p-summary">Woodland · Blotch</span>
    </div>
    <div class="sheet__body">

      <h2 class="sheet__section">Pattern</h2>

      <label class="field">
        <span class="field__top"><span class="field__label">Colourway</span></span>
        <select class="select" id="p-palette">
          <option value="woodland">Woodland</option>
          <option value="desert">Desert</option>
          <option value="urban">Urban</option>
          <option value="snow">Snow</option>
          <option value="tropic">Tropic</option>
          <option value="flecktarn">Flecktarn</option>
        </select>
      </label>

      <label class="field">
        <span class="field__top"><span class="field__label">Pattern</span></span>
        <select class="select" id="p-pattern">
          <option value="blotch">Blotch</option>
          <option value="fleck">Fleck</option>
        </select>
      </label>

      <h2 class="sheet__section">Look</h2>

      <label class="field">
        <span class="field__top"><span class="field__label">Blur</span><span class="field__value" id="p-blur-val">1.0</span></span>
        <input class="dial" id="p-blur" type="range" min="0" max="2" step="0.1" value="1">
      </label>

      <label class="field">
        <span class="field__top"><span class="field__label">Layers</span><span class="field__value" id="p-layers-val">4</span></span>
        <input class="dial" id="p-layers" type="range" min="2" max="6" step="1" value="4">
      </label>

      <p class="sheet__note">Random rolls a new seed and leaves the dials where they are. The seed and every setting ride in the address bar, so a link repaints exactly this pattern.</p>
    </div>
  </aside>

<script src="/assets/play.js" defer></script>
<script src="camo.js" defer></script>
