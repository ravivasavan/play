<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>magnetic — play</title>
  <meta name="description" content="Scattered windows that magnetise into a face when you click.">
  <script>
    /* Set data-theme before paint to avoid FOUC. Cycles: day → night → system. */
    (function () {
      var t = null;
      try { t = localStorage.getItem('theme'); } catch (e) {}
      document.documentElement.dataset.theme = (t === 'day' || t === 'night' || t === 'system') ? t : 'system';
    })();
  </script>
  <style>
    @font-face {
      font-family: "Labil Grotesk";
      src: url("/assets/fonts/LabilGrotesk-Regular.woff2") format("woff2"),
           url("/assets/fonts/LabilGrotesk-Regular.woff") format("woff");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    :root {
      /* Brand colours — inherited from ravivasavan.com */
      --night: #0d1b1e;
      --orange: #ff795c;
      --white: #fff5f5;

      --bg: var(--white);
      --ink: var(--night);
      --muted: color-mix(in srgb, var(--night) 55%, var(--white));
      --chrome: #ffffff;
    }
    [data-theme="night"] {
      --bg: var(--night);
      --ink: var(--white);
      --muted: color-mix(in srgb, var(--white) 55%, var(--night));
      --chrome: #16282d;
    }
    @media (prefers-color-scheme: dark) {
      [data-theme="system"] {
        --bg: var(--night);
        --ink: var(--white);
        --muted: color-mix(in srgb, var(--white) 55%, var(--night));
        --chrome: #16282d;
      }
    }
    * { box-sizing: border-box; margin: 0; }
    html, body { height: 100%; overflow: hidden; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: "Labil Grotesk", system-ui, sans-serif;
      font-size: 16px;
      line-height: 1.3;
      touch-action: none;
      overscroll-behavior: none;
    }

    /* Floating pill chrome — ported from ravivasavan.com */
    :root {
      --pill-bg: rgba(255, 245, 245, 0.2);
      --pill-filter: blur(10px) saturate(180%);
      --separator: color-mix(in srgb, var(--night) 5%, transparent);
    }
    [data-theme="night"] {
      --pill-bg: rgba(13, 27, 30, 0.5);
      --separator: color-mix(in srgb, var(--white) 8%, transparent);
    }
    @media (prefers-color-scheme: dark) {
      [data-theme="system"] {
        --pill-bg: rgba(13, 27, 30, 0.5);
        --separator: color-mix(in srgb, var(--white) 8%, transparent);
      }
    }
    .pills {
      position: fixed;
      top: 40px;
      z-index: 500;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .pills--left { left: 40px; }
    .pills--right { right: 40px; }

    .header-pill {
      background: var(--pill-bg);
      backdrop-filter: var(--pill-filter);
      -webkit-backdrop-filter: var(--pill-filter);
      border-radius: 32px;
      padding: 8px;
      box-shadow: inset 0 0 0 1px var(--separator);
      margin: 0;
    }
    .header-pill__inner { display: flex; align-items: center; gap: 12px; }
    .header-pill__avatar {
      width: 48px;
      height: 48px;
      border-radius: 48px;
      background: var(--separator);
      overflow: hidden;
      flex-shrink: 0;
    }
    .header-pill__avatar svg { width: 100%; height: 100%; display: block; }
    .header-pill__label { display: flex; flex-direction: column; gap: 4px; padding-right: 12px; }
    .header-pill__name { font-size: 16px; line-height: 1.3; }
    .header-pill__role { font-size: 16px; line-height: 1.3; opacity: 0.6; }

    /* Icon pill — same construction as the main site's theme pill: 64px pill,
       48px inner circle, bg blob expands on hover. */
    .icon-pill[hidden] { display: none; }
    .icon-pill {
      background: var(--pill-bg);
      backdrop-filter: var(--pill-filter);
      -webkit-backdrop-filter: var(--pill-filter);
      border: 0;
      border-radius: 32px;
      padding: 8px;
      cursor: pointer;
      color: var(--ink);
      box-shadow: inset 0 0 0 1px var(--separator);
      display: inline-flex;
      font: inherit;
      position: relative;
      overflow: hidden;
      text-decoration: none;
    }
    .icon-pill::before {
      content: '';
      position: absolute;
      top: 8px;
      left: 8px;
      width: 48px;
      height: 48px;
      background: var(--separator);
      border-radius: 48px;
      z-index: 0;
      transition:
        top          240ms cubic-bezier(0.4, 0, 0.2, 1),
        left         240ms cubic-bezier(0.4, 0, 0.2, 1),
        width        240ms cubic-bezier(0.4, 0, 0.2, 1),
        height       240ms cubic-bezier(0.4, 0, 0.2, 1),
        border-radius 240ms cubic-bezier(0.4, 0, 0.2, 1);
    }
    .icon-pill:hover::before,
    .icon-pill:focus-visible::before {
      top: 3.2px;
      left: 3.2px;
      width: 57.6px;
      height: 57.6px;
      border-radius: 38.4px;
    }
    .icon-pill__icon {
      width: 48px;
      height: 48px;
      border-radius: 48px;
      display: grid;
      place-items: center;
      flex-shrink: 0;
      position: relative;
      z-index: 1;
    }
    .icon-pill__icon svg {
      grid-area: 1 / 1;
      width: 18px;
      height: 18px;
      transition: opacity 240ms ease-out, transform 240ms cubic-bezier(0.4, 0, 0.2, 1);
    }
    /* camera pill crossfades camera ↔ camera-off with .is-on */
    .icon-pill svg[data-state="off"] { opacity: 0; transform: rotate(-90deg) scale(0.85); }
    .icon-pill.is-on svg[data-state="on"] { opacity: 0; transform: rotate(90deg) scale(0.85); }
    .icon-pill.is-on svg[data-state="off"] { opacity: 1; transform: rotate(0) scale(1); }

    /* theme pill — glyph matching [data-theme] fades in, hover previews next */
    .icon-pill--theme .icon-pill__icon svg { opacity: 0; transform: rotate(-90deg) scale(0.85); }
    [data-theme="day"]    .icon-pill--theme svg[data-tstate="day"],
    [data-theme="night"]  .icon-pill--theme svg[data-tstate="night"],
    [data-theme="system"] .icon-pill--theme svg[data-tstate="system"] {
      opacity: 1;
      transform: rotate(0deg) scale(1);
    }
    [data-theme="day"]    .icon-pill--theme:hover svg[data-tstate="day"],
    [data-theme="night"]  .icon-pill--theme:hover svg[data-tstate="night"],
    [data-theme="system"] .icon-pill--theme:hover svg[data-tstate="system"] {
      opacity: 0;
      transform: rotate(90deg) scale(0.85);
    }
    [data-theme="day"]    .icon-pill--theme:hover svg[data-tstate="night"],
    [data-theme="night"]  .icon-pill--theme:hover svg[data-tstate="system"],
    [data-theme="system"] .icon-pill--theme:hover svg[data-tstate="day"] {
      opacity: 1;
      transform: rotate(0deg) scale(1);
    }

    @media (max-width: 640px) {
      .pills { top: 12px; }
      .pills--left { left: 12px; }
      .pills--right { right: 12px; }
      .header-pill__role { display: none; }
    }

    #stage {
      position: fixed;
      inset: 0;
      cursor: pointer;
    }

    .win {
      position: absolute;
      left: 0;
      top: 0;
      overflow: hidden; /* clips bar + screen to the rounded corners */
      background: var(--chrome);
      box-shadow:
        0 1px 2px rgba(0,0,0,0.10),
        0 8px 24px rgba(0,0,0,0.14);
      will-change: transform;
      backface-visibility: hidden;
      cursor: grab;
    }
    .win.dragging { cursor: grabbing; }
    /* chrome tone variants — silver, graphite, warm, plain */
    .win.c1 { background: color-mix(in oklab, var(--chrome), #9a9a9a 22%); }
    .win.c2 { background: color-mix(in oklab, var(--chrome), var(--night) 14%); }
    .win.c3 { background: color-mix(in oklab, var(--chrome), #efccc4 20%); }

    .screen {
      position: absolute;
      overflow: hidden;
      background: #10181a;
      pointer-events: none;
    }
    .screen .media {
      position: absolute;
      background-size: cover;
      background-position: center;
    }
    .screen video {
      position: absolute;
      object-fit: cover;
      transform: scaleX(-1);
    }

    .bar {
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      display: flex;
      align-items: center;
    }
    .bar .x {
      background: color-mix(in oklab, var(--muted), transparent 40%);
      border: none;
      border-radius: 50%;
      width: 8px;
      height: 8px;
      padding: 0;
      margin-left: 8px;
      flex-shrink: 0;
      cursor: pointer;
      position: relative;
      transition: background-color 0.15s ease, scale 0.15s ease;
    }
    .bar .x::after { content: ""; position: absolute; inset: -10px; }
    .bar .x:hover { background: var(--orange); scale: 1.15; }

    #hint {
      position: fixed;
      bottom: 24px;
      left: 0;
      right: 0;
      text-align: center;
      color: var(--muted);
      pointer-events: none;
      z-index: 500;
      opacity: 1;
      transition: opacity 0.6s ease;
    }
    #hint.gone { opacity: 0; }

    #file { display: none; }
  </style>
</head>
<body>

          <svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg"> <rect width="2.00001" height="2.00001" transform="matrix(-1 0 0 1 32 13)" fill="currentColor"/> <rect width="4.00001" height="2.00001" transform="matrix(-1 0 0 1 20 13)" fill="currentColor"/> <path d="M34.0098 34.9766V48H36V34.9766H34.0098ZM13.9902 34.9766H12V48H13.9902V35.0293H15.9805V32.9814H13.9902V34.9766ZM32 13H16V9H14V17H16V15H32V25H30V27H18V31H16V33H18V35H30V33H32V35H34V33H32V31H34V15H40V13H34V9H32V13ZM12 22H14V17H12V22ZM28 21H30V19H28V21ZM20 21H22V19H20V21ZM30 9H32V7H30V9ZM16 9H18V7H16V9ZM18 7H30V5H18V7Z" fill="currentColor"/> <rect width="4" height="6" transform="matrix(-1 0 0 1 18 27)" fill="currentColor"/> <rect width="2.00001" height="4.00001" transform="matrix(-1 0 0 1 16 21)" fill="currentColor"/> <path d="M16 25H18V21H16V25Z" fill="currentColor"/> <rect width="16.0001" height="2.00001" transform="matrix(-1 0 0 1 30 25)" fill="currentColor"/> <rect width="4.00001" height="2.00001" transform="matrix(-1 0 0 1 32 23)" fill="currentColor"/> <rect width="4.00001" height="2.00001" transform="matrix(-1 0 0 1 24 23)" fill="currentColor"/> <rect width="4.00001" height="2.00001" transform="matrix(-1 0 0 1 28 21)" fill="currentColor"/> </svg>

        </svg>

  <div id="stage"></div>
  <p id="hint">click anywhere to magnetise</p>
  <input id="file" type="file" accept="image/*">

<script>
(() => {
  const stage = document.getElementById('stage');
  const hint = document.getElementById('hint');
  const fileInput = document.getElementById('file');
  const btnUpload = document.getElementById('btn-upload');
  const btnCamera = document.getElementById('btn-camera');
  const btnSnap = document.getElementById('btn-snap');
  const btnShuffle = document.getElementById('btn-shuffle');

  const N_MIN = 14, N_MAX = 18;  // tiles generated before outers are pruned
  const RATIO = 3 / 4;           // portrait w:h
  const GAP = 12;                // uniform gap between assembled windows, chrome included
  const rand = (a, b) => a + Math.random() * (b - a);
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];

  // ---------- state ----------
  let wins = [];                 // {el, screen, media, nr, rect, bez, spr, ...}
  let portrait = { w: 0, h: 0 };
  let assembled = false;
  let anchor = { x: 0, y: 0 };
  let stream = null;             // live webcam stream
  let imageURL = null;           // current image (object URL or data URL)
  let zTop = 100;

  // ---------- springs ----------
  // Underdamped springs: organic overshoot, exact convergence — the magnetise feel.
  function spring(value, stiffness, zeta) {
    const damping = 2 * zeta * Math.sqrt(stiffness);
    return { p: value, v: 0, t: value, k: stiffness, c: damping };
  }
  function step(s, dt) {
    const a = s.k * (s.t - s.p) - s.c * s.v;
    s.v += a * dt;
    s.p += s.v * dt;
  }
  const settled = s => Math.abs(s.v) < 0.01 && Math.abs(s.t - s.p) < 0.01;

  // ---------- assembled layout ----------
  // Recursive split of a portrait rect, normalized 0-1 so tiles rescale
  // with the viewport.
  function makeRects(n, W, H) {
    let rects = [{ x: 0, y: 0, w: W, h: H }];
    while (rects.length < n) {
      rects.sort((a, b) => b.w * b.h - a.w * a.h);
      const r = rects.shift();
      const f = rand(0.38, 0.62);
      if (r.w > r.h) {
        rects.push({ x: r.x, y: r.y, w: r.w * f, h: r.h },
                   { x: r.x + r.w * f, y: r.y, w: r.w * (1 - f), h: r.h });
      } else {
        rects.push({ x: r.x, y: r.y, w: r.w, h: r.h * f },
                   { x: r.x, y: r.y + r.h * f, w: r.w, h: r.h * (1 - f) });
      }
    }
    return rects.map(r => ({ x: r.x / W, y: r.y / H, w: r.w / W, h: r.h / H }));
  }

  // Drop some edge tiles so the silhouette is ragged, not a perfect
  // rectangle — corner tiles are likeliest to go, the center always stays.
  function pruneOuter(nrects) {
    const keep = nrects.filter(r => {
      const edge = r.x < 0.01 || r.y < 0.01 ||
                   r.x + r.w > 0.99 || r.y + r.h > 0.99;
      if (!edge) return true;
      const corner = Math.hypot(r.x + r.w / 2 - 0.5, r.y + r.h / 2 - 0.5);
      return Math.random() > corner * 0.95;
    });
    return keep.length >= 9 ? keep : nrects;
  }

  // outer window rect (chrome included) in composition coordinates —
  // each tile inset by GAP/2 so neighbours sit exactly GAP apart
  function px(nr) {
    return {
      x: nr.x * portrait.w + GAP / 2,
      y: nr.y * portrait.h + GAP / 2,
      w: nr.w * portrait.w - GAP,
      h: nr.h * portrait.h - GAP
    };
  }

  function portraitSize() {
    const vw = innerWidth, vh = innerHeight;
    const h = Math.min(vh * 0.72, (vw * 0.9) / RATIO);
    return { w: h * RATIO, h };
  }

  // ---------- placeholder pattern (visible alignment before any image) ----------
  function placeholder(W, H) {
    const c = document.createElement('canvas');
    const dpr = Math.min(devicePixelRatio || 1, 2);
    c.width = W * dpr; c.height = H * dpr;
    const g = c.getContext('2d');
    g.scale(dpr, dpr);
    g.fillStyle = '#10181a';
    g.fillRect(0, 0, W, H);
    g.strokeStyle = '#3d4e52';
    g.lineWidth = 1;
    const cx = W / 2, cy = H / 2;
    for (let r = W * 0.06; r < Math.max(W, H) * 0.75; r += W * 0.075) {
      g.beginPath(); g.arc(cx, cy, r, 0, Math.PI * 2); g.stroke();
    }
    g.beginPath();
    g.moveTo(cx, 0); g.lineTo(cx, H);
    g.moveTo(0, cy); g.lineTo(W, cy);
    g.stroke();
    return c.toDataURL('image/png');
  }

  // ---------- windows ----------
  const winW = w => w.outer.w;
  const winH = w => w.outer.h;

  function scatterPose(w) {
    const m = 24;
    return {
      x: rand(m, Math.max(m + 1, innerWidth - winW(w) - m)),
      y: rand(m + 104, Math.max(m + 105, innerHeight - winH(w) - m)),
      r: rand(-22, 22),
      s: rand(0.55, 1.0)
    };
  }

  // Per-window chrome: seamless OS-window style — borderless, just a flat
  // title bar with a close dot. Bar height is shared by the whole group;
  // radius and tone still vary per window.
  function makeChrome(barH) {
    return {
      bez: { t: barH, r: 0, b: 0, l: 0 },
      radius: pick([6, 8, 10, 12]),
      tone: pick(['', 'c1', 'c2', 'c3'])
    };
  }

  function sizeWindow(w) {
    w.outer = px(w.nr);
    // screen rect in composition coordinates: outer minus chrome
    w.scr = {
      x: w.outer.x + w.bez.l,
      y: w.outer.y + w.bez.t,
      w: w.outer.w - w.bez.l - w.bez.r,
      h: w.outer.h - w.bez.t - w.bez.b
    };
    w.el.style.width = w.outer.w + 'px';
    w.el.style.height = w.outer.h + 'px';
    const sc = w.screen.style;
    sc.left = w.bez.l + 'px';
    sc.top = w.bez.t + 'px';
    sc.width = w.scr.w + 'px';
    sc.height = w.scr.h + 'px';
    w.bar.style.height = w.bez.t + 'px';
  }

  function build() {
    wins.forEach(w => w.el.remove());
    wins = [];
    portrait = portraitSize();
    const n = Math.round(rand(N_MIN, N_MAX));
    const nrects = pruneOuter(makeRects(n, portrait.w, portrait.h));
    const barH = rand(17, 24); // one chrome height for the whole group
    for (const nr of nrects) {
      const chrome = makeChrome(barH);
      const el = document.createElement('div');
      el.className = 'win ' + chrome.tone;
      el.style.borderRadius = chrome.radius + 'px';
      el.style.zIndex = Math.floor(rand(1, 99));
      const screen = document.createElement('div');
      screen.className = 'screen';
      const media = document.createElement('div');
      media.className = 'media';
      screen.appendChild(media);
      const bar = document.createElement('div');
      bar.className = 'bar';
      const x = document.createElement('button');
      x.className = 'x';
      x.type = 'button';
      x.ariaLabel = 'close window';
      bar.append(x);
      el.append(screen, bar);
      stage.appendChild(el);
      const w = {
        el, screen, media, bar, nr, chrome, bez: chrome.bez,
        delayUntil: 0, forceDraw: true
      };
      x.addEventListener('pointerdown', e => e.stopPropagation());
      x.addEventListener('click', () => closeWin(w));
      sizeWindow(w);
      const p = scatterPose(w);
      const k = rand(140, 200), z = rand(0.72, 0.84);
      w.spr = { x: spring(p.x, k, z), y: spring(p.y, k, z),
                r: spring(p.r, k * 1.2, 0.9), s: spring(p.s, k * 1.2, 0.9) };
      attachDrag(w);
      wins.push(w);
    }
    applyMedia();
  }

  // recompute pixel geometry after a viewport change, keeping the same tiling
  function relayout() {
    portrait = portraitSize();
    for (const w of wins) {
      w.rect = px(w.nr);
      sizeWindow(w);
    }
    applyMedia();
  }

  // size + offset each window's media so all windows sample one shared frame
  function applyMedia() {
    for (const w of wins) {
      const m = w.media;
      m.style.width = portrait.w + 'px';
      m.style.height = portrait.h + 'px';
      m.style.left = -w.scr.x + 'px';
      m.style.top = -w.scr.y + 'px';
      const v = w.screen.querySelector('video');
      if (stream) {
        let vid = v;
        if (!vid) {
          vid = document.createElement('video');
          vid.muted = true; vid.playsInline = true; vid.autoplay = true;
          vid.srcObject = stream;
          w.screen.appendChild(vid);
        }
        vid.style.width = portrait.w + 'px';
        vid.style.height = portrait.h + 'px';
        vid.style.left = -w.scr.x + 'px';
        vid.style.top = -w.scr.y + 'px';
        m.style.display = 'none';
      } else {
        if (v) v.remove();
        m.style.display = '';
        m.style.backgroundImage =
          `url("${imageURL || placeholder(portrait.w, portrait.h)}")`;
      }
    }
  }

  // ---------- magnetise / scatter ----------
  function magnetise() {
    anchor.x = (innerWidth - portrait.w) / 2;
    anchor.y = Math.max((innerHeight - portrait.h) / 2, 112);
    const cx = innerWidth / 2, cy = innerHeight / 2;
    const now = performance.now();
    for (const w of wins) {
      const dx = (w.spr.x.p + winW(w) / 2) - cx;
      const dy = (w.spr.y.p + winH(w) / 2) - cy;
      w.delayUntil = now + Math.min(Math.hypot(dx, dy) * 0.22, 180);
      w.pending = { x: anchor.x + w.outer.x, y: anchor.y + w.outer.y, r: 0, s: 1 };
    }
    assembled = true;
  }

  function scatter() {
    const now = performance.now();
    for (const w of wins) {
      w.delayUntil = now + rand(0, 120);
      w.pending = scatterPose(w);
    }
    assembled = false;
  }

  function closeWin(w) {
    w.closing = true;
    w.pending = null;
    w.el.style.pointerEvents = 'none';
    const k = 320;
    w.spr.s.k = k;
    w.spr.s.c = 2 * 0.95 * Math.sqrt(k);
    w.spr.s.t = 0;
  }

  // ---------- render loop (fixed timestep for stable springs) ----------
  let last = performance.now(), acc = 0;
  const H_STEP = 1 / 120;
  function render() {
    const now = performance.now();
    acc += Math.min((now - last) / 1000, 0.05);
    last = now;
    for (const w of wins) {
      if (w.pending && now >= w.delayUntil) {
        w.spr.x.t = w.pending.x; w.spr.y.t = w.pending.y;
        w.spr.r.t = w.pending.r; w.spr.s.t = w.pending.s;
        w.pending = null;
      }
    }
    while (acc >= H_STEP) {
      for (const w of wins)
        for (const key in w.spr) step(w.spr[key], H_STEP);
      acc -= H_STEP;
    }
    let removed = false;
    for (const w of wins) {
      const { x, y, r, s } = w.spr;
      if (w.closing && s.p < 0.04) {
        w.el.remove();
        w.dead = true;
        removed = true;
        continue;
      }
      // skip the style write once fully settled — keeps idle frames near-free
      if (!(settled(x) && settled(y) && settled(r) && settled(s)) || w.forceDraw) {
        w.forceDraw = false;
        if (w.closing) w.el.style.opacity = Math.max(0, s.p);
        w.el.style.transform =
          `translate3d(${x.p}px, ${y.p}px, 0) rotate(${r.p}deg) scale(${s.p})`;
      }
    }
    if (removed) {
      wins = wins.filter(w => !w.dead);
      if (!wins.length) {
        hint.textContent = 'all closed — shuffle to start over';
        hint.classList.remove('gone');
      }
    }
    requestAnimationFrame(render);
  }

  // ---------- interaction ----------
  function attachDrag(w) {
    let sx, sy, ox, oy, dragging = false, id = null;
    w.el.addEventListener('pointerdown', e => {
      e.stopPropagation();
      id = e.pointerId;
      sx = e.clientX; sy = e.clientY;
      ox = w.spr.x.p; oy = w.spr.y.p;
      w.el.setPointerCapture(id);
      const move = e2 => {
        if (e2.pointerId !== id) return;
        const dx = e2.clientX - sx, dy = e2.clientY - sy;
        if (!dragging && Math.hypot(dx, dy) > 6) {
          dragging = true;
          w.el.classList.add('dragging');
          w.el.style.zIndex = ++zTop;
          w.pending = null;
          w.spr.s.t = Math.min(w.spr.s.t * 1.04, 1.06);
        }
        if (dragging) {
          w.spr.x.t = ox + dx;
          w.spr.y.t = oy + dy;
        }
      };
      const up = e2 => {
        if (e2.pointerId !== id) return;
        w.el.removeEventListener('pointermove', move);
        w.el.removeEventListener('pointerup', up);
        w.el.removeEventListener('pointercancel', up);
        w.el.classList.remove('dragging');
        if (dragging) {
          // a flick keeps its momentum; the spring catches it
          w.spr.s.t = assembled ? 1 : w.spr.s.t / 1.04;
        } else {
          toggle();
        }
        dragging = false;
      };
      w.el.addEventListener('pointermove', move);
      w.el.addEventListener('pointerup', up);
      w.el.addEventListener('pointercancel', up);
    });
  }

  function toggle() {
    hint.classList.add('gone');
    assembled ? scatter() : magnetise();
  }

  stage.addEventListener('pointerup', e => {
    if (e.target === stage) toggle();
  });

  // ---------- image upload ----------
  btnUpload.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', () => {
    const f = fileInput.files[0];
    if (!f) return;
    stopCamera();
    if (imageURL && imageURL.startsWith('blob:')) URL.revokeObjectURL(imageURL);
    imageURL = URL.createObjectURL(f);
    applyMedia();
  });

  // ---------- webcam ----------
  async function startCamera() {
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'user', width: { ideal: 1280 } }, audio: false
      });
      btnSnap.hidden = false;
      btnCamera.classList.add('is-on');
      btnCamera.ariaLabel = 'Stop camera';
      applyMedia();
    } catch (err) {
      hint.textContent = 'camera unavailable — ' + (err.name || err);
      hint.classList.remove('gone');
    }
  }
  function stopCamera() {
    if (!stream) return;
    stream.getTracks().forEach(t => t.stop());
    stream = null;
    btnSnap.hidden = true;
    btnCamera.classList.remove('is-on');
    btnCamera.ariaLabel = 'Use camera';
    applyMedia();
  }
  btnCamera.addEventListener('click', () => stream ? stopCamera() : startCamera());

  btnSnap.addEventListener('click', () => {
    const vid = stage.querySelector('video');
    if (!vid || !vid.videoWidth) return;
    // cover-crop the frame to the portrait ratio, mirrored like the preview
    const vw = vid.videoWidth, vh = vid.videoHeight;
    const outH = Math.min(vh, 1600), outW = outH * RATIO;
    const scale = Math.max(outW / vw, outH / vh);
    const c = document.createElement('canvas');
    c.width = outW; c.height = outH;
    const g = c.getContext('2d');
    g.translate(outW, 0); g.scale(-1, 1);
    g.drawImage(vid,
      (outW - vw * scale) / 2, (outH - vh * scale) / 2,
      vw * scale, vh * scale);
    imageURL = c.toDataURL('image/jpeg', 0.92);
    stopCamera();
  });

  // ---------- shuffle / resize ----------
  btnShuffle.addEventListener('click', () => {
    hint.textContent = 'click anywhere to magnetise';
    hint.classList.add('gone');
    build();
    if (assembled) magnetise();
  });

  let resizeT;
  addEventListener('resize', () => {
    clearTimeout(resizeT);
    resizeT = setTimeout(() => {
      relayout();
      if (assembled) magnetise();
    }, 150);
  });

  // ---------- theme pill (ported from ravivasavan.com) ----------
  const themeBtn = document.querySelector('[data-theme-toggle]');
  const CYCLE = ['day', 'night', 'system'];
  themeBtn.addEventListener('click', () => {
    const html = document.documentElement;
    const next = CYCLE[(CYCLE.indexOf(html.dataset.theme || 'system') + 1) % CYCLE.length];
    html.dataset.theme = next;
    try { localStorage.setItem('theme', next); } catch (e) {}
  });

  build();
  requestAnimationFrame(render);
})();
</script>
</body>
</html>
