<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>play — Ravi Vasavan</title>
  <meta name="description" content="Experiments, out in the open.">
  <style>
    :root {
      --bg: #f7f4ee;
      --ink: #1a1a18;
      --muted: #8a867c;
      --rule: #e3dfd5;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #171613;
        --ink: #ece9e1;
        --muted: #7d796f;
        --rule: #2b2a25;
      }
    }
    * { box-sizing: border-box; margin: 0; }
    html { height: 100%; }
    body {
      min-height: 100%;
      background: var(--bg);
      color: var(--ink);
      font: 16px/1.6 ui-monospace, "SF Mono", Menlo, monospace;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    main { width: 100%; max-width: 560px; }
    h1 { font-size: 1em; font-weight: 600; }
    h1::after { content: "_"; animation: blink 1.2s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    p { color: var(--muted); margin-top: 4px; }
    ol {
      list-style: none;
      margin-top: 48px;
      border-top: 1px solid var(--rule);
    }
    ol:empty::after {
      content: "nothing here yet.";
      display: block;
      padding-top: 16px;
      color: var(--muted);
    }
    ol a {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 0;
      border-bottom: 1px solid var(--rule);
      color: inherit;
      text-decoration: none;
    }
    ol a:hover { color: var(--muted); }
    ol time { color: var(--muted); flex-shrink: 0; }
    footer { margin-top: 48px; }
    footer a { color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>play</h1>
    <p>Experiments, out in the open.</p>
    <ol>
      <!-- <li><a href="/experiments/slug/">name <time>2026-07</time></a></li> -->
    </ol>
    <footer><a href="https://ravivasavan.com">ravivasavan.com</a></footer>
  </main>
</body>
</html>
