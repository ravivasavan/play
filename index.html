<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>play — Ravi Vasavan</title>
  <meta name="description" content="Experiments, out in the open.">
  <style>
    @font-face {
      font-family: "Labil Grotesk";
      src: url("/assets/fonts/LabilGrotesk-Regular.woff2") format("woff2"),
           url("/assets/fonts/LabilGrotesk-Regular.woff") format("woff");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    :root {
      /* Brand colours — inherited from ravivasavan.com */
      --night: #0d1b1e;
      --orange: #ff795c;
      --white: #fff5f5;

      --bg: var(--white);
      --fg: var(--night);
      --separator: color-mix(in srgb, var(--night) 5%, transparent);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: var(--night);
        --fg: var(--white);
        --separator: color-mix(in srgb, var(--white) 8%, transparent);
      }
    }

    * { box-sizing: border-box; margin: 0; }
    html { background: var(--bg); height: 100%; }
    body {
      min-height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: "Labil Grotesk", system-ui, sans-serif;
      font-size: 16px;
      line-height: 1.3;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    a { color: inherit; text-decoration: none; }

    main { width: 100%; max-width: 720px; }
    h1 {
      font-size: 24px;
      font-weight: 400;
    }
    .lede {
      margin-top: 4px;
      opacity: 0.6;
    }

    ol {
      list-style: none;
      margin-top: 80px;
      padding: 0;
    }
    ol:empty::after {
      content: "nothing here yet.";
      display: block;
      padding: 24px 0;
      border-top: 1px solid var(--separator);
      opacity: 0.6;
    }
    ol a {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 16px;
      padding: 24px;
      margin: 0 -24px;
      border-top: 1px solid var(--separator);
      transition: background-color 120ms ease, color 120ms ease;
    }
    ol li:last-child a { border-bottom: 1px solid var(--separator); }
    ol a:hover {
      background: var(--orange);
      color: var(--night);
    }
    ol time { opacity: 0.6; flex-shrink: 0; }

    footer { margin-top: 80px; }
    footer a { opacity: 0.6; transition: opacity 120ms ease; }
    footer a:hover { opacity: 1; }
  </style>
</head>
<body>
  <main>
    <h1>play</h1>
    <p class="lede">Experiments, out in the open.</p>
    <ol>
      <li><a href="/experiments/magnetic/">magnetic <time>2026-07</time></a></li>
    </ol>
    <footer><a href="https://ravivasavan.com">ravivasavan.com</a></footer>
  </main>
</body>
</html>
